spring.application.name=foodai-backend

spring.datasource.url=jdbc:mysql://localhost:3306/foodai?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Ho_Chi_Minh
spring.datasource.username=root
spring.datasource.password=${DB_PASSWORD:Duc06092005@}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

# ========================================================
# [BE-05] Cloudinary & File Upload Configuration
# ========================================================
# Cloudinary credentials (fallback to demo credentials or env vars)
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:foodai-cloud}
cloudinary.api-key=${CLOUDINARY_API_KEY:your_api_key}
cloudinary.api-secret=${CLOUDINARY_API_SECRET:your_api_secret}

# Upload folder on Cloudinary
cloudinary.folder=foodai/food_images

# Maximum upload file size (Proposal NFR: 10MB limit)
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
