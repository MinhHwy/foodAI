spring.application.name=foodai-backend

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/foodai?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Ho_Chi_Minh}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

# ========================================================
# [BE-05] Cloudinary & File Upload Configuration
# ========================================================
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:t3ekbats}
cloudinary.api-key=${CLOUDINARY_API_KEY:711966682438342}
cloudinary.api-secret=${CLOUDINARY_API_SECRET:2jAKC96j3nOeiIxIHAucWIV7ebk}

# Upload folder on Cloudinary
cloudinary.folder=foodai/food_images

# Maximum upload file size (Proposal NFR: 10MB limit)
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# JWT signing key
foodai.jwt.secret=${FOODAI_JWT_SECRET:FoodAISecretKeyForJwtTokenGenerationAndValidation2026DaNang}
foodai.jwt.validity-minutes=1440
foodai.cors.allowed-origin-patterns=${FOODAI_CORS_ALLOWED_ORIGINS:http://localhost:3000,http://127.0.0.1:5500}

# AI recognition service - Bật fallback và mock để test luồng mượt mà
foodai.ai.base-url=${FOODAI_AI_BASE_URL:http://localhost:8000/predict}
foodai.ai.mock=${FOODAI_AI_MOCK:true}
foodai.ai.fallback.enabled=${FOODAI_AI_FALLBACK_ENABLED:true}