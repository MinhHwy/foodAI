
spring.application.name=foodai-backend

spring.datasource.url=jdbc:mysql://localhost:3306/foodai?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Ho_Chi_Minh
spring.datasource.username=root
spring.datasource.password=123456

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

# JWT signing key. Read from environment (FOODAI_JWT_SECRET); when absent the app
# generates an ephemeral random key - tokens then survive only until restart.
# Never commit a real secret to source control.
foodai.jwt.secret=${FOODAI_JWT_SECRET:}
foodai.jwt.validity-minutes=1440
