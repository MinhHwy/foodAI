spring.application.name=foodai-backend

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/foodai?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Ho_Chi_Minh}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

# ========================================================
# [BE-05] Cloudinary & File Upload Configuration
# ========================================================
# Cloudinary credentials are provided through environment variables.
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:}
cloudinary.api-key=${CLOUDINARY_API_KEY:}
cloudinary.api-secret=${CLOUDINARY_API_SECRET:}

# Upload folder on Cloudinary
cloudinary.folder=foodai/food_images

# Maximum upload file size (Proposal NFR: 10MB limit)
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# JWT signing key. Read from environment (FOODAI_JWT_SECRET); when absent the app
# generates an ephemeral random key - tokens then survive only until restart.
# Never commit a real secret to source control.
foodai.jwt.secret=${FOODAI_JWT_SECRET:}
foodai.jwt.validity-minutes=1440
foodai.cors.allowed-origin-patterns=${FOODAI_CORS_ALLOWED_ORIGINS:http://localhost:3000,http://127.0.0.1:5500}
