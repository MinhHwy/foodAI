spring.application.name=foodai-backend

# Database
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/foodai?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Ho_Chi_Minh}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

# BE-02: JWT Security
security.jwt.secret-base64=${JWT_SECRET_BASE64:}
security.jwt.expiration-ms=${JWT_EXPIRATION_MS:900000}

# CORS
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:5500,http://127.0.0.1:5500}

# BE-06: AI Recognition
ai.service.base-url=${AI_SERVICE_BASE_URL:}
ai.service.recognition-path=${AI_SERVICE_RECOGNITION_PATH:}
ai.service.request-mode=${AI_SERVICE_REQUEST_MODE:}
ai.service.image-part-name=${AI_SERVICE_IMAGE_PART_NAME:}
ai.service.connect-timeout=${AI_SERVICE_CONNECT_TIMEOUT:2s}
ai.service.response-timeout=${AI_SERVICE_RESPONSE_TIMEOUT:30s}
foodai.recognition.max-image-bytes=${RECOGNITION_MAX_IMAGE_BYTES:10485760}

# BE-05: Cloudinary
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:foodai-cloud}
cloudinary.api-key=${CLOUDINARY_API_KEY:your_api_key}
cloudinary.api-secret=${CLOUDINARY_API_SECRET:your_api_secret}
cloudinary.folder=foodai/food_images

# Multipart upload: support 10 MB image requests
spring.servlet.multipart.max-file-size=${RECOGNITION_MAX_IMAGE_SIZE:10MB}
spring.servlet.multipart.max-request-size=${RECOGNITION_MAX_REQUEST_SIZE:11MB}